<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logic Circuit Builder</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Lucide Icons -->

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-white">

  <div id="root"></div>

  <!-- Your React code with JSX -->
  <script type="text/babel">

    const { useState, useRef, useEffect } = React;

    const LogicCircuitBuilder = () => {
      const [gates, setGates] = useState([]);
      const [inputs, setInputs] = useState([]);
      const [outputs, setOutputs] = useState([]);
      const [dragging, setDragging] = useState(null);
      const [connecting, setConnecting] = useState(null);
      const canvasRef = useRef(null);
      const [offset, setOffset] = useState({ x: 0, y: 0 });

      const gateTypes = [
        { type: 'AND', color: 'bg-blue-500', inputs: 2 },
        { type: 'OR', color: 'bg-green-500', inputs: 2 },
        { type: 'NOT', color: 'bg-red-500', inputs: 1 },
        { type: 'NAND', color: 'bg-purple-500', inputs: 2 },
        { type: 'NOR', color: 'bg-orange-500', inputs: 2 },
        { type: 'XOR', color: 'bg-pink-500', inputs: 2 },
      ];

      const calculateGateOutput = (gate, allGates, allInputs) => {
        const inputValues = gate.inputConnections.map(conn => {
          if (!conn) return 0;
          if (conn.type === 'input') {
            const input = allInputs.find(i => i.id === conn.sourceId);
            return input ? input.value : 0;
          } else {
            const sourceGate = allGates.find(g => g.id === conn.sourceId);
            return sourceGate ? sourceGate.output : 0;
          }
        });

        switch (gate.type) {
          case 'AND': return inputValues.every(v => v === 1) ? 1 : 0;
          case 'OR': return inputValues.some(v => v === 1) ? 1 : 0;
          case 'NOT': return inputValues[0] === 1 ? 0 : 1;
          case 'NAND': return inputValues.every(v => v === 1) ? 0 : 1;
          case 'NOR': return inputValues.some(v => v === 1) ? 0 : 1;
          case 'XOR': return inputValues.filter(v => v === 1).length === 1 ? 1 : 0;
          default: return 0;
        }
      };

      useEffect(() => {
        setGates(prevGates => prevGates.map(g => ({ ...g, output: calculateGateOutput(g, prevGates, inputs) })));
      }, [inputs]);

      useEffect(() => {
        setOutputs(prevOutputs => prevOutputs.map(o => {
          if (!o.connection) return o;
          if (o.connection.type === 'gate') {
            const gate = gates.find(g => g.id === o.connection.sourceId);
            return { ...o, value: gate ? gate.output : 0 };
          } else if (o.connection.type === 'input') {
            const input = inputs.find(i => i.id === o.connection.sourceId);
            return { ...o, value: input ? input.value : 0 };
          }
          return o;
        }));
      }, [gates, inputs]);

      const addGate = (type) => {
        const gateType = gateTypes.find(g => g.type === type);
        setGates([...gates, {
          id: Date.now(),
          type,
          x: 300,
          y: 100 + gates.length * 80,
          inputConnections: Array(gateType.inputs).fill(null),
          output: 0
        }]);
      };

      const addInput = () => setInputs([...inputs, { id: Date.now(), x: 50, y: 100 + inputs.length * 80, value: 0, label: `IN${inputs.length + 1}` }]);
      const addOutput = () => setOutputs([...outputs, { id: Date.now(), x: 650, y: 100 + outputs.length * 80, value: 0, label: `OUT${outputs.length + 1}`, connection: null }]);
      const toggleInput = (id) => setInputs(inputs.map(i => i.id === id ? { ...i, value: i.value === 0 ? 1 : 0 } : i));

      const handleMouseDown = (e, item, itemType) => {
        if (e.button !== 0) return;
        const rect = canvasRef.current.getBoundingClientRect();
        setDragging({ item, itemType });
        setOffset({ x: e.clientX - rect.left - item.x, y: e.clientY - rect.top - item.y });
      };
      const handleMouseMove = (e) => {
        if (!dragging) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const newX = e.clientX - rect.left - offset.x;
        const newY = e.clientY - rect.top - offset.y;
        if (dragging.itemType === 'gate') setGates(gates.map(g => g.id === dragging.item.id ? { ...g, x: newX, y: newY } : g));
        if (dragging.itemType === 'input') setInputs(inputs.map(i => i.id === dragging.item.id ? { ...i, x: newX, y: newY } : i));
        if (dragging.itemType === 'output') setOutputs(outputs.map(o => o.id === dragging.item.id ? { ...o, x: newX, y: newY } : o));
      };
      const handleMouseUp = () => setDragging(null);

      const startConnection = (e, sourceId, sourceType) => { e.stopPropagation(); setConnecting({ sourceId, sourceType }); };
      const completeConnection = (e, targetId, targetType, index) => {
        e.stopPropagation(); if (!connecting) return;
        if (targetType === 'gate') {
          setGates(gates.map(g => g.id === targetId ? { ...g, inputConnections: g.inputConnections.map((c,i) => i===index?{sourceId:connecting.sourceId,type:connecting.sourceType}:c) } : g));
        } else if (targetType === 'output') {
          setOutputs(outputs.map(o => o.id===targetId ? {...o, connection:{sourceId:connecting.sourceId,type:connecting.sourceType}}:o));
        }
        setConnecting(null);
      };

      const deleteGate = (id) => { setGates(gates.filter(g=>g.id!==id).map(g=>({...g,inputConnections:g.inputConnections.map(c=>c&&c.sourceId===id?null:c)}))); };
      const deleteInput = (id) => { setInputs(inputs.filter(i=>i.id!==id)); setGates(gates.map(g=>({...g,inputConnections:g.inputConnections.map(c=>c&&c.sourceId===id?null:c)}))); };
      const deleteOutput = (id) => setOutputs(outputs.filter(o=>o.id!==id));
      const clearAll = () => { setGates([]); setInputs([]); setOutputs([]); };

      const getConnectionPoint = (item, itemType, isOutput=false,index=0) => {
        if(itemType==='input') return {x:item.x+40,y:item.y+20};
        if(itemType==='gate'){if(isOutput)return{x:item.x+80,y:item.y+30}; const g=gateTypes.find(gt=>gt.type===item.type); const spacing=60/(g.inputs+1); return{x:item.x,y:item.y+spacing*(index+1)};}
        if(itemType==='output') return {x:item.x,y:item.y+20};
      };

      const renderWires = () => {
        const wires=[];
        gates.forEach(g=>g.inputConnections.forEach((c,i)=>{if(!c)return;let sp;if(c.type==='input'){const input=inputs.find(inp=>inp.id===c.sourceId);if(input)sp=getConnectionPoint(input,'input',true);}else{const sg=gates.find(gt=>gt.id===c.sourceId);if(sg)sp=getConnectionPoint(sg,'gate',true);}const tp=getConnectionPoint(g,'gate',false,i);if(sp&&tp){const active=c.type==='input'?inputs.find(i=>i.id===c.sourceId)?.value===1:gates.find(gt=>gt.id===c.sourceId)?.output===1; wires.push(<line key={`wire-${g.id}-${i}`} x1={sp.x} y1={sp.y} x2={tp.x} y2={tp.y} stroke={active?'#fbbf24':'#4b5563'} strokeWidth="3"/>)}}));
        outputs.forEach(o=>{if(!o.connection)return;let sp;if(o.connection.type==='input'){const input=inputs.find(i=>i.id===o.connection.sourceId);if(input)sp=getConnectionPoint(input,'input',true);}else{const sg=gates.find(g=>g.id===o.connection.sourceId);if(sg)sp=getConnectionPoint(sg,'gate',true);}const tp=getConnectionPoint(o,'output',false);if(sp&&tp)wires.push(<line key={`wire-out-${o.id}`} x1={sp.x} y1={sp.y} x2={tp.x} y2={tp.y} stroke={o.value===1?'#fbbf24':'#4b5563'} strokeWidth="3"/>);});
        return wires;
      };

      return (
        <div className="w-full h-screen bg-gray-900 text-white flex flex-col">
          <div className="bg-gray-800 p-4 border-b border-gray-700">
            <h1 className="text-2xl font-bold mb-4">Logic Circuit Builder</h1>
            <div className="flex gap-4 flex-wrap">
              <div><h3 className="text-sm text-gray-400 mb-2">Gates</h3>
                <div className="flex gap-2">{gateTypes.map(g=><button key={g.type} onClick={()=>addGate(g.type)} className={`${g.color} px-3 py-2 rounded text-sm font-bold hover:opacity-80`}>{g.type}</button>)}</div>
              </div>
              <div><h3 className="text-sm text-gray-400 mb-2">Components</h3>
                <div className="flex gap-2">
                  <button onClick={addInput} className="bg-cyan-600 px-3 py-2 rounded text-sm font-bold hover:opacity-80 flex items-center gap-1"><span className="text-lg">⏻</span> Input</button>
                  <button onClick={addOutput} className="bg-yellow-600 px-3 py-2 rounded text-sm font-bold hover:opacity-80 flex items-center gap-1"><span className="text-lg">⚡</span> Output</button>
                </div>
              </div>
              <div><h3 className="text-sm text-gray-400 mb-2">Actions</h3>
                <button onClick={clearAll} className="bg-red-600 px-3 py-2 rounded text-sm font-bold hover:opacity-80 flex items-center gap-1"><span className="text-lg">🗑️</span> Clear All</button>
              </div>
            </div>
          </div>

          <div ref={canvasRef} className="flex-1 relative overflow-hidden bg-gray-950" onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}>
            {/* Render inputs */}
            {inputs.map(input => (
              <div key={input.id} onMouseDown={(e)=>handleMouseDown(e,input,'input')} onDoubleClick={()=>deleteInput(input.id)} className="absolute cursor-grab select-none" style={{left:input.x,top:input.y}}>
                <div className={`flex items-center gap-2 bg-gray-800 px-3 py-2 rounded shadow`}>
                  <div onClick={(e)=>{e.stopPropagation(); toggleInput(input.id);}} className={`w-6 h-6 rounded ${input.value===1?'bg-amber-400':'bg-gray-600'} flex items-center justify-center text-black font-bold`}>{input.value===1?'1':'0'}</div>
                  <div className="text-sm">{input.label}</div>
                  <div onMouseDown={(e)=>startConnection(e,input.id,'input')} className="w-3 h-3 bg-gray-400 rounded-full ml-2 cursor-pointer" title="Start connection" />
                </div>
              </div>
            ))}

            {/* Render gates */}
            {gates.map(gate => {
              const gt = gateTypes.find(gt=>gt.type===gate.type) || {color:'bg-gray-500', inputs:2};
              return (
                <div key={gate.id} onMouseDown={(e)=>handleMouseDown(e,gate,'gate')} className="absolute cursor-grab select-none" style={{left:gate.x,top:gate.y}}>
                  <div className={`p-3 rounded shadow ${gt.color} text-black`}>
                    <div className="flex items-center justify-between gap-2">
                      <div className="font-bold">{gate.type}</div>
                      <div className="text-sm font-mono">{gate.output}</div>
                    </div>
                    <div className="mt-2 flex items-center gap-2">
                      <div className="flex flex-col gap-1">
                        {Array(gt.inputs).fill(0).map((_,i)=> (
                          <div key={i} onMouseDown={(e)=>e.stopPropagation()} onMouseUp={(e)=>completeConnection(e,gate.id,'gate',i)} className="w-3 h-3 bg-gray-700 rounded-full cursor-pointer" title={`Input ${i+1}`} />
                        ))}
                      </div>
                      <div className="flex-1" />
                      <div onMouseDown={(e)=>startConnection(e,gate.id,'gate')} className="w-3 h-3 bg-gray-700 rounded-full cursor-pointer" title="Output" />
                    </div>
                  </div>
                </div>
              );
            })}

            {/* Render outputs */}
            {outputs.map(output => (
              <div key={output.id} onMouseDown={(e)=>handleMouseDown(e,output,'output')} className="absolute cursor-grab select-none" style={{left:output.x,top:output.y}}>
                <div className={`flex items-center gap-2 bg-gray-800 px-3 py-2 rounded shadow`}>
                  <div onMouseUp={(e)=>completeConnection(e,output.id,'output',0)} className="w-3 h-3 bg-gray-400 rounded-full mr-2 cursor-pointer" title="Connect input" />
                  <div className="text-sm">{output.label}</div>
                  <div className={`ml-2 w-6 h-6 rounded flex items-center justify-center ${output.value===1?'bg-amber-400':'bg-gray-600'} text-black font-bold`}>{output.value===1?'1':'0'}</div>
                </div>
              </div>
            ))}

            <svg className="absolute inset-0 w-full h-full pointer-events-none">{renderWires()}</svg>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<LogicCircuitBuilder />);

  </script>
</body>
</html>
